<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="color-scheme" content="dark">
  <title>Invaders — codebar AI workshop</title>
  <meta name="description" content="A one-page Space Invaders built with canvas and vanilla JavaScript. Play in your browser.">
  <meta property="og:title" content="Invaders">
  <meta property="og:description" content="A one-page Space Invaders built with canvas and vanilla JavaScript.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E1116'/%3E%3Cpath d='M16 5l9 20H7z' fill='%2384B59F'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="cabinet">
      <div class="screen">
        <canvas
          id="game"
          width="800"
          height="600"
          aria-label="Invaders arcade game. Use the left and right arrow keys to move and space to shoot."
        ></canvas>
      </div>

      <div class="pad" id="pad">
        <button type="button" class="pad-btn" data-control="left" aria-label="Move left">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="pad-btn" data-control="right" aria-label="Move right">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="pad-btn pad-fire" data-control="fire" aria-label="Shoot">SHOOT</button>
      </div>
    </div>

    <p class="hint">
      <kbd>←</kbd> <kbd>→</kbd> move <span class="sep">·</span> <kbd>space</kbd> shoot
    </p>
  </main>

  <script src="game.js"></script>
</body>
</html>
