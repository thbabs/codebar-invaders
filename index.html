<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invaders</title>
  <meta name="description" content="A one-page Space Invaders built with canvas and vanilla JavaScript.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="frame">
      <canvas
        id="game"
        width="800"
        height="600"
        aria-label="Invaders arcade game. Use the left and right arrow keys to move and space to fire."
      ></canvas>
    </div>
    <p class="hint">
      <kbd>←</kbd> <kbd>→</kbd> move &nbsp;·&nbsp; <kbd>space</kbd> fire
    </p>
  </main>

  <script src="game.js"></script>
</body>
</html>
